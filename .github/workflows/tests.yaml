name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path replconnect/src/rust/Cargo.toml -p replconnect-core

  r:
    name: R package (testthat)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: replconnect
          extra-packages: any::testthat
      - name: Build status probe
        run: cargo build --manifest-path replconnect/src/rust/Cargo.toml -p replconnect-core --example status_probe
      - name: Install package
        run: R CMD INSTALL replconnect
      - name: Run tests
        run: Rscript -e 'testthat::test_local("replconnect", stop_on_failure = TRUE)'

  nvim:
    name: Neovim plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arnold-c/REPLConnect.nvim
          path: REPLConnect.nvim
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Run Neovim tests
        env:
          REPLCONNECT_CORE: ${{ github.workspace }}/REPLConnect.nvim
        run: nvim --headless -u NONE -l tests/launch.lua
